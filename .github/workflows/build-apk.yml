name: Build Offline WFO APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wfo-signing.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/wfo-signing.jks" >> $GITHUB_ENV
          fi

      - name: Build Debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found! Current repository files:"
            find . -maxdepth 4 -not -path '*/.*'
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Building Gradle project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WFO-Attendance-Tracker
          path: .github/workflows/app/build/outputs/apk/debug/app-debug.apk
